<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test FENVA BEAUTY</title>
</head>

<body>

  <h1>FENVA BEAUTY</h1>

  <input
    id="email"
    type="email"
    placeholder="E-mail"
  >

  <input
    id="password"
    type="password"
    placeholder="Mot de passe"
  >

  <button
    id="loginBtn"
    type="button"
  >
    Se connecter
  </button>

  <p id="message"></p>

  <script>

    document
      .getElementById('loginBtn')
      .addEventListener('click', function(){

        alert('LE BOUTON FONCTIONNE');

        document
          .getElementById('message')
          .textContent =
          'JavaScript fonctionne correctement.';

      });

  </script>

</body>
</html>
