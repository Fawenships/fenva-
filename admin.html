<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FENVA BEAUTY — Administration</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --cream:#F7F4EE;
    --beige:#E9E3D8;
    --nude:#1F6F64;
    --brown:#262322;
    --gold:#2F8577;
    --white:#FFFFFF;
    --line:#E1DACB;
  }

  *{
    box-sizing:border-box;
    margin:0;
    padding:0;
  }

  body{
    background:var(--cream);
    color:var(--brown);
    font-family:'Jost',sans-serif;
    font-weight:300;
    min-height:100%;
  }

  .wrap{
    max-width:760px;
    margin:0 auto;
    padding:48px 24px 80px;
  }

  h1{
    font-family:'Cormorant Garamond',serif;
    font-weight:700;
    font-size:32px;
    margin-bottom:6px;
  }

  .sub{
    opacity:.6;
    font-size:14px;
    margin-bottom:36px;
  }

  .card{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:8px;
    padding:26px;
    margin-bottom:26px;
  }

  label{
    display:block;
    font-size:13px;
    font-weight:600;
    margin:14px 0 6px;
  }

  label:first-child{
    margin-top:0;
  }

  input,select,textarea{
    width:100%;
    padding:11px 14px;
    border:1px solid var(--line);
    border-radius:4px;
    background:var(--cream);
    color:var(--brown);
    font-family:'Jost',sans-serif;
    font-size:14px;
  }

  textarea{
    resize:vertical;
    min-height:70px;
  }

  .btn{
    display:inline-block;
    background:var(--gold);
    color:#fff;
    border:none;
    border-radius:4px;
    padding:13px 28px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    margin-top:18px;
  }

  .btn:hover{
    opacity:.92;
  }

  .btn-danger{
    background:#B4453A;
    color:#fff;
    border:none;
    border-radius:4px;
    padding:8px 14px;
    font-size:13px;
    cursor:pointer;
  }

  .btn-logout{
    background:transparent;
    color:var(--brown);
    border:1px solid var(--line);
    border-radius:4px;
    padding:9px 16px;
    font-size:13px;
    cursor:pointer;
  }

  .list{
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    border:1px solid var(--line);
    border-radius:6px;
    padding:12px 16px;
    background:var(--white);
  }

  .item .info{
    font-size:14px;
  }

  .item .info b{
    font-weight:600;
  }

  .item .cat-tag{
    font-size:12px;
    opacity:.6;
    margin-top:3px;
  }

  .locked{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:70vh;
  }

  .locked-box{
    text-align:center;
    max-width:320px;
    width:100%;
  }

  .locked input{
    margin-top:16px;
    text-align:center;
  }

  .locked input + input{
    margin-top:10px;
  }

  .msg{
    font-size:13px;
    color:var(--gold);
    margin-top:8px;
    min-height:16px;
  }

  .note{
    font-size:13px;
    opacity:.6;
    margin-top:10px;
    line-height:1.5;
  }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    margin-bottom:36px;
  }

  .topbar .sub{
    margin-bottom:0;
  }

  @media(max-width:520px){
    .topbar{
      align-items:flex-start;
      flex-direction:column;
    }

    .item{
      align-items:flex-start;
      flex-direction:column;
    }

    .btn-danger{
      width:100%;
    }
  }
</style>
</head>

<body>

<!-- CONNEXION -->

<div id="lockScreen" class="locked">

  <div class="locked-box">

    <h1>Administration</h1>

    <p class="sub">FENVA BEAUTY</p>

    <label for="emailInput">
      Adresse e-mail
    </label>

    <input
      id="emailInput"
      type="email"
      placeholder="Adresse e-mail"
      autocomplete="username"
    >

    <label for="passwordInput">
      Mot de passe
    </label>

    <input
      id="passwordInput"
      type="password"
      placeholder="Mot de passe"
      autocomplete="current-password"
    >

    <button
      class="btn"
      id="loginBtn"
      type="button"
    >
      Se connecter
    </button>

    <div
      class="msg"
      id="lockMsg"
    ></div>

  </div>

</div>


<!-- ADMINISTRATION -->

<div
  id="adminScreen"
  class="wrap"
  style="display:none;"
>

  <div class="topbar">

    <div>

      <h1>Gestion des produits</h1>

      <p class="sub">
        Administration FENVA BEAUTY
      </p>

    </div>

    <button
      class="btn-logout"
      id="logoutBtn"
      type="button"
    >
      Déconnexion
    </button>

  </div>


  <div class="card">

    <label for="pname">
      Nom du produit
    </label>

    <input
      id="pname"
      type="text"
      placeholder="Ex. Sérum Éclat"
    >

    <label for="pprice">
      Prix
    </label>

    <input
      id="pprice"
      type="text"
      placeholder="Ex. 1 200 HTG"
    >

    <label for="pcat">
      Catégorie
    </label>

    <select id="pcat">

      <option>Soins du visage</option>
      <option>Soins du corps</option>
      <option>Soins des cheveux</option>
      <option>Parfums</option>
      <option>Maquillage</option>
      <option>Accessoires</option>

    </select>

    <label for="pdesc">
      Description (optionnel)
    </label>

    <textarea
      id="pdesc"
      placeholder="Courte description du produit"
    ></textarea>

    <button
      class="btn"
      id="addProductBtn"
      type="button"
    >
      Ajouter le produit
    </button>

    <div
      class="msg"
      id="formMsg"
    ></div>

  </div>


  <h1 style="font-size:22px;margin-bottom:16px;">
    Produits actuels
  </h1>

  <div
    class="list"
    id="productList"
  ></div>

  <p class="note">
    Les produits sont maintenant enregistrés dans Supabase.
    Ils peuvent donc être accessibles depuis les différents appareils
    qui utilisent la boutique.
  </p>

</div>


<script>

/* =========================================================
   CONFIGURATION SUPABASE
========================================================= */

var SUPABASE_URL =
  'https://pgiualcqiiilgmjqdwlfq.supabase.co';

var SUPABASE_KEY =
  'sb_publishable_KCYLHW-qWK7QVmLyNw5DlA_KRvSmNtB';

var TABLE = 'produits';

var accessToken = null;


/* =========================================================
   HEADERS
========================================================= */

function getHeaders(){

  return {
    'apikey': SUPABASE_KEY,
    'Authorization':
      'Bearer ' + (accessToken || SUPABASE_KEY),
    'Content-Type':'application/json'
  };

}


/* =========================================================
   ECHAPPEMENT HTML
========================================================= */

function esc(s){

  return String(s).replace(
    /[&<>"]/g,
    function(c){

      return {
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;'

      }[c];

    }
  );

}


/* =========================================================
   CONNEXION SUPABASE
========================================================= */

function loginAdmin(email,password){

  return fetch(
    SUPABASE_URL +
    '/auth/v1/token?grant_type=password',
    {
      method:'POST',

      headers:{
        'apikey':SUPABASE_KEY,
        'Content-Type':'application/json'
      },

      body:JSON.stringify({
        email:email,
        password:password
      })
    }
  )

  .then(function(response){

    return response.text().then(function(raw){

      var data = {};

      try{
        data = JSON.parse(raw);
      }
      catch(error){
        data = {};
      }

      if(!response.ok){

        throw new Error(
          'Supabase ' +
          response.status +
          ': ' +
          (
            data.error_description ||
            data.msg ||
            data.message ||
            raw ||
            'Erreur inconnue'
          )
        );

      }

      if(!data.access_token){

        throw new Error(
          'Supabase : aucun access_token reçu.'
        );

      }

      accessToken =
        data.access_token;

      return true;

    });

  });

}


/* =========================================================
   DECONNEXION
========================================================= */

function logoutAdmin(){

  if(!accessToken){

    return Promise.resolve();

  }

  var token =
    accessToken;

  accessToken = null;

  return fetch(
    SUPABASE_URL +
    '/auth/v1/logout',
    {
      method:'POST',

      headers:{
        'apikey':SUPABASE_KEY,
        'Authorization':
          'Bearer ' + token
      }
    }
  ).catch(function(){});

}


/* =========================================================
   CHARGER LES PRODUITS
========================================================= */

function fetchProducts(){

  return fetch(
    SUPABASE_URL +
    '/rest/v1/' +
    TABLE +
    '?select=*&order=created_at.desc',
    {
      method:'GET',
      headers:getHeaders()
    }
  )

  .then(function(response){

    if(!response.ok){

      throw new Error(
        'Impossible de charger les produits.'
      );

    }

    return response.json();

  })

  .catch(function(error){

    console.error(
      'Erreur chargement produits:',
      error
    );

    return [];

  });

}


/* =========================================================
   AFFICHER LES PRODUITS
========================================================= */

function renderList(){

  var list =
    document.getElementById(
      'productList'
    );

  list.innerHTML =
    '<p class="sub">Chargement...</p>';

  fetchProducts()
    .then(function(products){

      if(!products.length){

        list.innerHTML =
          '<p class="sub">Aucun produit pour l\'instant.</p>';

        return;

      }

      list.innerHTML =
        products.map(function(product){

          return (
            '<div class="item">' +

              '<div class="info">' +

                '<b>' +
                esc(product.name) +
                '</b>' +

                ' — ' +

                esc(product.price) +

                '<div class="cat-tag">' +
                esc(product.cat || '') +
                '</div>' +

              '</div>' +

              '<button ' +
              'class="btn-danger" ' +
              'type="button" ' +
              'onclick="removeProduct(' +
              Number(product.id) +
              ')">' +

              'Supprimer' +

              '</button>' +

            '</div>'
          );

        }).join('');

    });

}


/* =========================================================
   AJOUT PRODUIT
========================================================= */

function addProduct(){

  var name =
    document
    .getElementById('pname')
    .value
    .trim();

  var price =
    document
    .getElementById('pprice')
    .value
    .trim();

  var cat =
    document
    .getElementById('pcat')
    .value;

  var desc =
    document
    .getElementById('pdesc')
    .value
    .trim();

  var msg =
    document
    .getElementById('formMsg');


  if(!name || !price){

    msg.textContent =
      'Nom et prix sont requis.';

    return;

  }


  if(!accessToken){

    msg.textContent =
      'Votre session administrateur a expiré.';

    return;

  }


  msg.textContent =
    'Ajout en cours…';


  fetch(
    SUPABASE_URL +
    '/rest/v1/' +
    TABLE,
    {
      method:'POST',

      headers:Object.assign(
        {},
        getHeaders(),
        {
          'Prefer':'return=representation'
        }
      ),

      body:JSON.stringify({
        name:name,
        price:price,
        cat:cat
      })
    }
  )

  .then(function(response){

    return response.text()
      .then(function(raw){

        if(!response.ok){

          throw new Error(
            raw ||
            'Impossible d\'ajouter le produit.'
          );

        }

        return raw;

      });

  })

  .then(function(){

    msg.textContent =
      'Produit ajouté.';

    document
      .getElementById('pname')
      .value = '';

    document
      .getElementById('pprice')
      .value = '';

    document
      .getElementById('pdesc')
      .value = '';

    renderList();

  })

  .catch(function(error){

    console.error(
      'Erreur ajout produit:',
      error
    );

    msg.textContent =
      'Erreur : ' +
      error.message;

  });

}


/* =========================================================
   SUPPRIMER
========================================================= */

function removeProduct(id){

  if(!accessToken){

    alert(
      'Votre session administrateur a expiré.'
    );

    return;

  }


  if(!confirm(
    'Supprimer ce produit ?'
  )){

    return;

  }


  fetch(
    SUPABASE_URL +
    '/rest/v1/' +
    TABLE +
    '?id=eq.' +
    encodeURIComponent(id),
    {
      method:'DELETE',
      headers:getHeaders()
    }
  )

  .then(function(response){

    if(!response.ok){

      return response.text()
        .then(function(raw){

          throw new Error(
            raw ||
            'Impossible de supprimer le produit.'
          );

        });

    }

    renderList();

  })

  .catch(function(error){

    console.error(
      'Erreur suppression:',
      error
    );

    alert(
      'Erreur : ' +
      error.message
    );

  });

}


/* =========================================================
   CONNEXION — TEST DU BOUTON
========================================================= */

document
  .getElementById('loginBtn')
  .addEventListener(
    'click',
    function(){

      alert(
        'LE BOUTON DE CONNEXION FONCTIONNE'
      );


      var email =
        document
        .getElementById('emailInput')
        .value
        .trim();

      var password =
        document
        .getElementById('passwordInput')
        .value;

      var msg =
        document
        .getElementById('lockMsg');


      if(!email || !password){

        msg.textContent =
          'E-mail et mot de passe sont requis.';

        return;

      }


      msg.textContent =
        'Connexion en cours…';


      loginAdmin(
        email,
        password
      )

      .then(function(){

        msg.textContent = '';

        document
          .getElementById('lockScreen')
          .style.display = 'none';

        document
          .getElementById('adminScreen')
          .style.display = 'block';

        renderList();

      })

      .catch(function(error){

        accessToken = null;

        console.error(
          'Erreur Supabase Auth:',
          error
        );

        msg.textContent =
          error.message ||
          'Erreur de connexion à Supabase.';

      });

    }
  );


/* =========================================================
   ENTER EMAIL
========================================================= */

document
  .getElementById('emailInput')
  .addEventListener(
    'keydown',
    function(event){

      if(event.key === 'Enter'){

        document
          .getElementById('passwordInput')
          .focus();

      }

    }
  );


/* =========================================================
   ENTER PASSWORD
========================================================= */

document
  .getElementById('passwordInput')
  .addEventListener(
    'keydown',
    function(event){

      if(event.key === 'Enter'){

        document
          .getElementById('loginBtn')
          .click();

      }

    }
  );


/* =========================================================
   AJOUT
========================================================= */

document
  .getElementById('addProductBtn')
  .addEventListener(
    'click',
    addProduct
  );


/* =========================================================
   DECONNEXION
========================================================= */

document
  .getElementById('logoutBtn')
  .addEventListener(
    'click',
    function(){

      logoutAdmin()
        .then(function(){

          document
            .getElementById('adminScreen')
            .style.display = 'none';

          document
            .getElementById('lockScreen')
            .style.display = 'flex';

          document
            .getElementById('emailInput')
            .value = '';

          document
            .getElementById('passwordInput')
            .value = '';

          document
            .getElementById('lockMsg')
            .textContent = '';

          document
            .getElementById('formMsg')
            .textContent = '';

        });

    }
  );


/* =========================================================
   EXPORT
========================================================= */

window.removeProduct =
  removeProduct;

</script>

</body>
</html>
